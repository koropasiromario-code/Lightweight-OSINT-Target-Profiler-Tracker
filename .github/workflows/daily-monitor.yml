name: Daily website metadata monitoring

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-website-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OSINT_ALLOWED_HOSTS: ${{ vars.OSINT_ALLOWED_HOSTS }}
      OSINT_TIMEOUT_SECONDS: "8"
      OSINT_MAX_RESPONSE_BYTES: "1000000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require explicit allowlist and persistent database
        run: |
          test -n "$DATABASE_URL" || (echo "Repository secret DATABASE_URL is required." && exit 1)
          test -n "$OSINT_ALLOWED_HOSTS" || (echo "Repository variable OSINT_ALLOWED_HOSTS is required." && exit 1)
      - name: Run one monitoring pass
        run: python scheduled_monitor.py
